name: Feature request
description: An idea, or a change to what Lotus Web does.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A change of behaviour or a new feature is agreed here before a pull request; a small fix needs no issue (see CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, for whom, and what stops you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would look to the app that mounts Lotus Web (a mount option, a resolver callback, a guide) and to the person at the dashboard. Say if it changes what the dashboard does today, or breaks an existing setup.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Other designs, and what you do today instead.

  - type: textarea
    id: risks
    attributes:
      label: Risks and trade-offs
      description: For example, for who may see or run what, or for performance.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the open and closed issues.
          required: true
        - label: I would like to make the pull request myself.
